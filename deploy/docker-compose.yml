# D7042E course kit — slim Arrowhead 5.2 local cloud (design: deploy/README.md).
#
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d
#
# Host ports:
#   profile-ca          http://localhost:8787   (bootstrap, CA info, revoke, PIP)
#                       https://localhost:8788  (mTLS: device and system certificates)
#   ServiceRegistry     https://serviceregistry:8490   (mTLS; curl --resolve serviceregistry:8490:127.0.0.1)
#   Authentication      https://authentication:8491    (mTLS)
#   ConsumerAuth        https://consumerauth:8492      (mTLS)
#   DynamicOrchestration http://localhost:8083  (plain HTTP)
#   Mosquitto           tcp://localhost:1883
#   InfluxDB            http://localhost:8086
#
# Images are pinned; nothing is built here.

name: d7042e-kit

x-healthcheck: &hc
  interval: 5s
  timeout: 3s
  retries: 20

services:

  profile-ca:
    image: ghcr.io/ulfbod/profile-ca:v0.1.2
    environment:
      PORT: "8787"
      TLS_PORT: "8788"
      CA_KEY_FILE: "/data/ca.key"
    volumes:
      - profile-ca-data:/data
    ports:
      - "8787:8787"
      - "8788:8788"
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/health || exit 1"]

  cert-provisioner:
    image: ghcr.io/ulfbod/cert-provisioner:v0.1.2
    environment:
      CA_URL: "http://profile-ca:8787"
      CERTS_DIR: "/certs"
    volumes:
      - certs:/certs
    depends_on:
      profile-ca:
        condition: service_healthy
    restart: "no"

  serviceregistry:
    image: ghcr.io/ulfbod/serviceregistry:v0.1.2
    environment:
      PORT: "8080"
      TLS_PORT: "8490"
      TLS_CERT_FILE: "/certs/serviceregistry.crt"
      TLS_KEY_FILE: "/certs/serviceregistry.key"
      TLS_CA_FILE: "/certs/ca.crt"
      DB_PATH: "/data/serviceregistry.db"
      MGMT_AUTH_URL: "http://authentication:8081"
      REGISTER_AUTH_URL: "http://authentication:8081"
      SR_AUTH_URL: "http://authentication:8081"
    volumes:
      - certs:/certs:ro
      - serviceregistry-data:/data
    ports:
      - "8490:8490"
    depends_on:
      cert-provisioner:
        condition: service_completed_successfully
      authentication:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]

  authentication:
    image: ghcr.io/ulfbod/authentication:v0.1.2
    environment:
      PORT: "8081"
      TLS_PORT: "8491"
      TLS_CERT_FILE: "/certs/authentication.crt"
      TLS_KEY_FILE: "/certs/authentication.key"
      TLS_CA_FILE: "/certs/ca.crt"
      DB_PATH: "/data/authentication.db"
      MGMT_AUTH_URL: "http://authentication:8081"
      SYSOP_PASSWORD: "${SYSOP_PASSWORD:?set SYSOP_PASSWORD in deploy/.env}"
    volumes:
      - certs:/certs:ro
      - authentication-data:/data
    ports:
      - "8491:8491"
    depends_on:
      cert-provisioner:
        condition: service_completed_successfully
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]

  consumerauth:
    image: ghcr.io/ulfbod/consumerauth:v0.1.2
    environment:
      PORT: "8082"
      TLS_PORT: "8492"
      TLS_CERT_FILE: "/certs/consumerauth.crt"
      TLS_KEY_FILE: "/certs/consumerauth.key"
      TLS_CA_FILE: "/certs/ca.crt"
      DB_PATH: "/data/consumerauth.db"
      MGMT_AUTH_URL: "http://authentication:8081"
    volumes:
      - certs:/certs:ro
      - consumerauth-data:/data
    ports:
      - "8492:8492"
    depends_on:
      cert-provisioner:
        condition: service_completed_successfully
      authentication:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]

  dynamicorch-xacml:
    image: ghcr.io/ulfbod/dynamicorch-xacml:v0.1.2
    environment:
      PORT: "8083"
      AUTH_BACKEND: "consumerauth"
      CA_URL: "http://consumerauth:8082"
      SR_URL: "http://serviceregistry:8080"
      ENABLE_AUTH: "true"
      MGMT_AUTH_URL: "http://authentication:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8083:8083"
    depends_on:
      serviceregistry:
        condition: service_healthy
      consumerauth:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/status || exit 1"]

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "setup"
      DOCKER_INFLUXDB_INIT_USERNAME: "${INFLUXDB_USERNAME:?set in deploy/.env}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_PASSWORD:?set in deploy/.env}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUXDB_ORG:?set in deploy/.env}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUXDB_BUCKET:?set in deploy/.env}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUXDB_ADMIN_TOKEN:?set in deploy/.env}"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      <<: *hc
      test: ["CMD-SHELL", "influx ping || exit 1"]

volumes:
  certs:
  profile-ca-data:
  serviceregistry-data:
  authentication-data:
  consumerauth-data:
  influxdb-data:
